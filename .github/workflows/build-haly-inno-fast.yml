name: Build Haly Inno installer (v4)

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/haly/windows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BRAVE_VERSION: '1.92.144'
      HALY_DISPLAY_VERSION: '1.92.144-haly.4'
      HALY_FILE_VERSION: '1.92.144.4'

    steps:
      - name: Check out installer sources only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/haly/windows
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Stage verified Brave payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'haly-inno-v4-build'
          $expanded = Join-Path $work 'expanded'
          $payload = Join-Path $work 'payload'
          $application = Join-Path $payload 'Application'
          New-Item -ItemType Directory -Force -Path $work, $expanded, $application | Out-Null

          $archiveName = "brave-v$env:BRAVE_VERSION-win32-x64.zip"
          $archive = Join-Path $work $archiveName
          $url = "https://github.com/brave/brave-browser/releases/download/v$env:BRAVE_VERSION/$archiveName"
          curl.exe -L --fail --retry 5 --retry-delay 4 --output $archive $url
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $archive) -or (Get-Item $archive).Length -lt 50MB) {
            throw 'The official Brave x64 ZIP could not be downloaded.'
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force
          $candidate = Get-ChildItem $expanded -Recurse -File -Filter brave.exe |
            Sort-Object { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } |
            Select-Object -First 1
          if (!$candidate) { throw 'The package does not contain brave.exe.' }

          $signature = Get-AuthenticodeSignature $candidate.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Brave Software') {
            throw "Unexpected Brave signature: $($signature.Status) / $($signature.SignerCertificate.Subject)"
          }
          Write-Host "Verified upstream browser signature: $($signature.SignerCertificate.Subject)"

          Copy-Item (Join-Path $candidate.Directory.FullName '*') $application -Recurse -Force
          Get-ChildItem $application -Recurse -File |
            Where-Object { $_.Name -match '^BraveUpdate.*\.exe$' } |
            Remove-Item -Force

          $browserExecutables = Get-ChildItem $application -Recurse -File -Filter brave.exe
          if (!$browserExecutables) { throw 'No browser executable was staged.' }
          foreach ($browserExecutable in $browserExecutables) {
            Rename-Item $browserExecutable.FullName 'haly-browser.exe'
          }

          "HALY_WORK=$work" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HALY_PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HALY_APPLICATION=$application" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rebrand safe UI strings and URL literals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\tools\haly\windows\repack_paks.py $env:HALY_APPLICATION --include-text
          if ($LASTEXITCODE -ne 0) { throw 'Safe resource repacking failed.' }

      - name: Replace the internal brave scheme with haly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\tools\haly\windows\patch_haly_scheme.py $env:HALY_APPLICATION
          if ($LASTEXITCODE -ne 0) { throw 'The Haly scheme patch failed.' }

      - name: Compile Haly launcher and icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $iconPath = Join-Path $env:HALY_WORK 'Haly.ico'
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::FromArgb(70, 42, 140))
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font 'Segoe UI', 150, ([System.Drawing.FontStyle]::Bold), ([System.Drawing.GraphicsUnit]::Pixel)
          $format = New-Object System.Drawing.StringFormat
          $format.Alignment = [System.Drawing.StringAlignment]::Center
          $format.LineAlignment = [System.Drawing.StringAlignment]::Center
          $graphics.DrawString('H', $font, $brush, (New-Object System.Drawing.RectangleF 0, 0, 256, 246), $format)
          $icon = [System.Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $stream = [System.IO.File]::Open($iconPath, [System.IO.FileMode]::Create)
          $icon.Save($stream)
          $stream.Dispose(); $icon.Dispose(); $graphics.Dispose(); $font.Dispose(); $brush.Dispose(); $bitmap.Dispose()

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $csc)) { throw "C# compiler was not found: $csc" }
          $launcher = Join-Path $env:HALY_PAYLOAD 'Haly.exe'
          $launcherSource = (Resolve-Path '.\tools\haly\windows\HalyLauncher.cs').Path
          & $csc /nologo /target:winexe /optimize+ /platform:x64 /reference:System.dll /reference:System.Core.dll /reference:System.Windows.Forms.dll "/win32icon:$iconPath" "/out:$launcher" $launcherSource
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $launcher)) { throw 'Haly.exe compilation failed.' }

          @"
          Haly Browser $env:HALY_DISPLAY_VERSION
          Unofficial personal rebrand based on Brave Browser $env:BRAVE_VERSION.
          Not produced, endorsed, or supported by Brave Software, Inc.
          Install: %LOCALAPPDATA%\Programs\Haly
          Profile: %LOCALAPPDATA%\Haly\User Data
          Internal scheme: haly://
          Source: https://github.com/ratnanoda/brave-core/pull/2

          The upstream signature was validated before rebranding. Modifying PE
          resources and the internal URL scheme invalidates the upstream binary
          signature by design. The Haly installer itself is not code-signed.
          "@ | Set-Content (Join-Path $env:HALY_PAYLOAD 'NOTICE-HALY.txt') -Encoding utf8
          "HALY_ICON=$iconPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate isolated payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $browser = Get-ChildItem $env:HALY_APPLICATION -Recurse -File -Filter haly-browser.exe |
            Sort-Object { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } |
            Select-Object -First 1
          if (!$browser) { throw 'haly-browser.exe is missing.' }
          if (Get-ChildItem $env:HALY_APPLICATION -Recurse -File -Filter brave.exe) {
            throw 'A brave.exe remains in the Haly payload.'
          }
          if (Get-ChildItem $env:HALY_APPLICATION -Recurse -File | Where-Object { $_.Name -match '^BraveUpdate.*\.exe$' }) {
            throw 'A Brave Update executable remains in the Haly payload.'
          }
          if (!(Test-Path (Join-Path $env:HALY_PAYLOAD 'Haly.exe'))) { throw 'Haly.exe is missing.' }
          "HALY_BROWSER=$($browser.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test renderer and Haly internal pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-HalySmoke([string] $Name, [string] $Url) {
            $profile = Join-Path $env:RUNNER_TEMP "haly-smoke-$Name"
            $stdout = Join-Path $env:RUNNER_TEMP "haly-smoke-$Name.stdout.txt"
            $stderr = Join-Path $env:RUNNER_TEMP "haly-smoke-$Name.stderr.txt"
            Remove-Item $profile, $stdout, $stderr -Recurse -Force -ErrorAction SilentlyContinue

            $arguments = @(
              '--headless=new',
              '--disable-gpu',
              '--no-sandbox',
              '--no-first-run',
              '--disable-background-networking',
              '--disable-component-update',
              "--user-data-dir=$profile",
              '--dump-dom',
              $Url
            )

            $process = Start-Process -FilePath $env:HALY_BROWSER -ArgumentList $arguments -WorkingDirectory (Split-Path $env:HALY_BROWSER) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (!$process.WaitForExit(60000)) {
              try { $process.Kill($true) } catch {}
              throw "$Name smoke test timed out."
            }

            $output = ''
            if (Test-Path $stdout) { $output += Get-Content $stdout -Raw }
            if (Test-Path $stderr) { $output += "`n" + (Get-Content $stderr -Raw) }
            Write-Host "----- $Name output -----"
            Write-Host $output

            if ($process.ExitCode -ne 0) {
              throw "$Name smoke test exited with code $($process.ExitCode)."
            }
            if ($output -match 'RESULT_CODE_KILLED_BAD_MESSAGE|Aw, Snap|このページを開けません') {
              throw "$Name smoke test detected a renderer or WebUI failure."
            }
            if ($output.Length -lt 20) {
              throw "$Name smoke test returned unexpectedly little output."
            }
          }

          Invoke-HalySmoke 'renderer' 'data:text/html,<title>HalySmoke</title><p>OK</p>'
          Invoke-HalySmoke 'version' 'haly://version/'
          Invoke-HalySmoke 'newtab' 'haly://newtab/'

      - name: Compile offline package with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }

          $output = Join-Path $env:GITHUB_WORKSPACE 'dist-haly-inno'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $env:HALY_OUTPUT = $output
          $installerScript = (Resolve-Path '.\tools\haly\windows\installer.iss').Path
          & $iscc $installerScript
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

          $installer = Join-Path $output 'HalySetup-x64.exe'
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 50MB) {
            throw 'The offline installer is missing or unexpectedly small.'
          }
          $hash = Get-FileHash $installer -Algorithm SHA256
          "$($hash.Hash.ToLower())  HalySetup-x64.exe" | Set-Content (Join-Path $output 'HalySetup-x64.exe.sha256') -Encoding ascii
          Copy-Item (Join-Path $env:HALY_PAYLOAD 'NOTICE-HALY.txt') $output
          Write-Host "Installer size: $([math]::Round((Get-Item $installer).Length / 1MB, 1)) MiB"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload offline installer
        uses: actions/upload-artifact@v4
        with:
          name: Haly-Inno-Windows-x64-${{ env.HALY_DISPLAY_VERSION }}
          path: dist-haly-inno/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
