name: Diagnose Haly scheme candidates

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/haly/windows/patch_haly_scheme.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      BRAVE_VERSION: '1.92.144'

    steps:
      - name: Check out the scheme tool only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/haly/windows/patch_haly_scheme.py
          sparse-checkout-cone-mode: false

      - name: Download and expand official Brave x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'haly-scheme-diagnostic'
          $expanded = Join-Path $root 'expanded'
          New-Item -ItemType Directory -Force -Path $root, $expanded | Out-Null
          $archiveName = "brave-v$env:BRAVE_VERSION-win32-x64.zip"
          $archive = Join-Path $root $archiveName
          $url = "https://github.com/brave/brave-browser/releases/download/v$env:BRAVE_VERSION/$archiveName"
          curl.exe -L --fail --retry 5 --retry-delay 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Download failed.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force
          "DIAGNOSTIC_ROOT=$expanded" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Report every exact scheme candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\tools\haly\windows\patch_haly_scheme.py $env:DIAGNOSTIC_ROOT --dry-run --report-all
